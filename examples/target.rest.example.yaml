# Шаблон для произвольного REST чат-бота. Скопируйте, укажите свой
# адрес и подгоните response.text_path под форму вашего JSON-ответа.

name: "Demo: custom REST chatbot"

request:
  url: "https://chat.example.com/api/message"
  method: POST
  headers:
    X-Api-Key: "${SUPPORT_BOT_API_KEY}"
    Content-Type: "application/json"
  body:
    session_id: "leakprobe-test"
    message: "{{input}}"

response:
  # Путь через точку внутри JSON-ответа, например {"reply": {"text": "..."}}
  text_path: "reply.text"

# Опционально: полезно только если вы заложили известный фейковый секрет
# в системный промпт/конфиг этого бота — чтобы leakprobe мог доказать утечку.
canary: null
timeout_seconds: 20
rate_limit_seconds: 1.5
