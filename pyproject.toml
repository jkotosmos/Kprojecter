[project]
name = "leakprobe"
version = "0.1.0"
description = "Battery-test a deployed chatbot for system-prompt and PII leakage, mapped to the OWASP LLM Top 10."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jkotosmos" }]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
leakprobe = "leakprobe.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leakprobe*"]

[tool.setuptools.package-data]
leakprobe = ["data/*.yaml"]
